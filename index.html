<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>国网题库</title>
  <meta name="description" content="多题库练习与模拟考试：公共与行业知识、机构模考等。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b7a4b'/%3E%3Ctext x='50' y='66' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif'%3ESG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" data-view="home">
      <span class="brand-mark">国网</span>
      <span class="brand-text">题库练习</span>
    </a>
    <nav class="nav" id="nav">
      <button data-view="home">题库</button>
      <button data-view="wrong">错题本</button>
      <button data-view="fav">收藏</button>
      <button data-view="stats">统计</button>
      <button data-view="settings">设置</button>
    </nav>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">◐</button>
  </header>

  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/banks/manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
